x-app-environment: &app-environment
  NODE_ENV: production
  API_HOST: 0.0.0.0
  API_PORT: 3000
  APP_URL:
  BETTER_AUTH_SECRETS:
  AUTHLANE_ALLOW_SIGNUP:
  CORS_ORIGIN:
  AUTHLANE_RUNTIME_DB_PASSWORD:
  AUTHLANE_WORKER_DB_PASSWORD:
  REDIS_PASSWORD:
  AUTHLANE_DATA_KEK_RING:
  AUTHLANE_LOOKUP_KEY_RING:
  AUTHLANE_REDIS_KEY_RING:
  METRICS_BEARER_TOKEN:
  TRUSTED_PROXY_CIDRS:
  RATE_LIMIT_ENABLED: 'true'
  RATE_LIMIT_MAX_REQUESTS:
  RATE_LIMIT_WINDOW_MS:
  RESEND_API_KEY:
  EMAIL_FROM:
  SENTRY_DSN:

services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    environment:
      POSTGRES_PASSWORD:
      AUTHLANE_RUNTIME_DB_PASSWORD:
      AUTHLANE_WORKER_DB_PASSWORD:
    command:
      - sh
      - -c
      - |
        export DATABASE_URL="postgresql://authlane_migrator:$$POSTGRES_PASSWORD@postgres:5432/authlane"
        node packages/database/dist/migrate.js
        node packages/database/dist/seed-catalog.js
        exec /app/docker/postgres/provision-roles.sh
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    exclude_from_hc: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    expose: ['3000']
    environment: *app-environment
    command:
      - sh
      - -c
      - |
        export BETTER_AUTH_URL="$$APP_URL"
        export DATABASE_URL="postgresql://authlane_app:$$AUTHLANE_RUNTIME_DB_PASSWORD@postgres:5432/authlane"
        export SYSTEM_DATABASE_URL="postgresql://authlane_job:$$AUTHLANE_WORKER_DB_PASSWORD@postgres:5432/authlane"
        export REDIS_URL="redis://:$$REDIS_PASSWORD@redis:6379"
        exec node apps/api/dist/index.js
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  postgres:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    environment:
      POSTGRES_DB: authlane
      POSTGRES_USER: authlane_migrator
      POSTGRES_PASSWORD:
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U authlane_migrator -d authlane']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD:
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data:
  redis_data:
