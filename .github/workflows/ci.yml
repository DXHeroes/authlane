name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.23.0'

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_USER: authlane
          POSTGRES_PASSWORD: authlane-ci-only
          POSTGRES_DB: authlane_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['6379:6379']
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://authlane:authlane-ci-only@localhost:5432/authlane_test
      SYSTEM_DATABASE_URL: postgresql://authlane:authlane-ci-only@localhost:5432/authlane_test
      REDIS_URL: redis://localhost:6379
      AUTHLANE_DATA_KEK_RING: ci-data:1111111111111111111111111111111111111111111111111111111111111111
      AUTHLANE_LOOKUP_KEY_RING: ci-lookup:2222222222222222222222222222222222222222222222222222222222222222
      AUTHLANE_REDIS_KEY_RING: ci-redis:3333333333333333333333333333333333333333333333333333333333333333
      BETTER_AUTH_SECRETS: 1:ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:5173
      METRICS_BEARER_TOKEN: ci-metrics-token-at-least-32-characters
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:runtime
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build

  container:
    name: Container build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          load: true
          push: false
          tags: authlane:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: authlane:${{ github.sha }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
