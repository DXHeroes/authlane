name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated Python artifacts to PyPI
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Python artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out dispatched SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.14
          enable-cache: false
      - name: Verify frozen release requirements
        run: python3 scripts/validate-python-release-lock.py
      - name: Install locked release tools without workspace source
        run: uv sync --project packages/python --frozen --no-dev --group release --no-install-project
      - name: Build wheel and source distribution
        run: uv run --project packages/python --no-sync uv build --clear --no-sources --no-build-isolation --out-dir packages/python/dist packages/python
      - name: Check package metadata
        run: uv run --project packages/python --no-sync twine check packages/python/dist/*
      - name: Inspect package inventories
        run: python3 scripts/validate-python-artifacts.py
      - name: Smoke-test wheel
        run: python3 scripts/smoke-python-artifact.py packages/python/dist/*.whl
      - name: Smoke-test source distribution
        run: python3 scripts/smoke-python-artifact.py packages/python/dist/*.tar.gz

  publish:
    name: Publish Python artifacts
    if: ${{ inputs.publish }}
    needs: validate
    runs-on: ubuntu-24.04
    environment: pypi-publish
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC authentication for PyPI Trusted Publishing.
    steps:
      - name: Check out dispatched SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.14
          enable-cache: false
      - name: Verify frozen release requirements
        run: python3 scripts/validate-python-release-lock.py
      - name: Install locked release tools without workspace source
        run: uv sync --project packages/python --frozen --no-dev --group release --no-install-project
      - name: Rebuild wheel and source distribution
        run: uv run --project packages/python --no-sync uv build --clear --no-sources --no-build-isolation --out-dir packages/python/dist packages/python
      - name: Recheck package metadata and inventory
        run: |
          uv run --project packages/python --no-sync twine check packages/python/dist/*
          python3 scripts/validate-python-artifacts.py
          python3 scripts/smoke-python-artifact.py packages/python/dist/*.whl
          python3 scripts/smoke-python-artifact.py packages/python/dist/*.tar.gz
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1, retrieved 2026-07-18
        with:
          packages-dir: packages/python/dist
          attestations: true
