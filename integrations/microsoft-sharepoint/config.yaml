id: microsoft-sharepoint
name: Microsoft Drive (SharePoint)
auth_type: oauth2
config:
  authorization_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
  token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
  scopes:
    - offline_access
    - openid
    - profile
    - User.Read
    - Files.ReadWrite.All
    - Sites.ReadWrite.All
  default_scopes:
    - offline_access
    - openid
    - profile
    - User.Read
    - Files.ReadWrite.All
    - Sites.ReadWrite.All
  read_only_scopes:
    - offline_access
    - openid
    - profile
    - User.Read
    - Files.Read.All
    - Sites.Read.All
  docs_url: https://learn.microsoft.com/graph/api/resources/sharepoint
  setup_guide_url: https://learn.microsoft.com/entra/identity-platform/quickstart-register-app
  developer_console_url: https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade
  execution:
    preferred: direct_api
