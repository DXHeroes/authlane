      summary: Rate limit exceeded
      value:
        data: null
        error:
          message: Rate limit exceeded
          code: RATE_LIMIT_EXCEEDED
          hint: Maximum 100 requests per 60 seconds
          docUrl: https://authlane.io/docs/api-reference/authentication
          statusCode: 429
