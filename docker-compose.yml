name: authlane

services:
  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '${AUTHLANE_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      CORS_ORIGIN: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://authlane:${POSTGRES_PASSWORD:-authlane}@postgres:5432/authlane
      REDIS_URL: redis://redis:6379
      AUTHLANE_DATA_KEK_RING: ${AUTHLANE_DATA_KEK_RING}
      AUTHLANE_LOOKUP_KEY_RING: ${AUTHLANE_LOOKUP_KEY_RING}
      AUTHLANE_REDIS_KEY_RING: ${AUTHLANE_REDIS_KEY_RING}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-1000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Authlane <noreply@localhost>}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authlane
      POSTGRES_USER: authlane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-authlane}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U authlane -d authlane']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ['monitoring']
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ['monitoring']
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
