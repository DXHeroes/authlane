id: microsoft-mail
name: Microsoft Mail
auth_type: oauth2
branding:
  description: Read, search, and send mail from your Outlook mailbox.
  brand_color: '#0078d4'
  initials: MM
  category: communication
config:
  authorization_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
  token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
  scopes:
    - offline_access
    - openid
    - profile
    - User.Read
    - Mail.ReadWrite
    - Mail.Send
  default_scopes:
    - offline_access
    - openid
    - profile
    - User.Read
    - Mail.ReadWrite
    - Mail.Send
  read_only_scopes:
    - offline_access
    - openid
    - profile
    - User.Read
    - Mail.Read
  docs_url: https://learn.microsoft.com/graph/api/resources/mail-api-overview
  setup_guide_url: https://learn.microsoft.com/entra/identity-platform/quickstart-register-app
  developer_console_url: https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade
  execution:
    preferred: direct_api
