[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "authlane"
version = "0.1.0"
description = "Typed Python SDK and local direct-provider tools for Authlane"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Authlane contributors" }]
keywords = ["authlane", "oauth", "ai", "tools", "integrations"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
]

[project.urls]
Homepage = "https://authlane.io/docs"
Documentation = "https://authlane.io/docs/sdk/python"
Repository = "https://github.com/dxheroes/authlane"
Issues = "https://github.com/dxheroes/authlane/issues"

[project.optional-dependencies]
agno = ["agno>=2.0,<3"]
langchain = ["langchain-core>=1.0,<2"]
openai-agents = ["openai-agents>=0.4,<1"]
all = [
  "agno>=2.0,<3",
  "langchain-core>=1.0,<2",
  "openai-agents>=0.4,<1",
]

[dependency-groups]
dev = [
  "anyio>=4.9,<5",
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "types-jsonschema>=4.23,<5",
]
release = [
  "hatchling==1.27.0",
  "twine==6.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/authlane"]

[tool.hatch.build.targets.sdist]
include = ["src/authlane", "LICENSE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["authlane"]

[[tool.mypy.overrides]]
module = ["agno.*", "langchain_core.*", "agents.*"]
ignore_missing_imports = true
