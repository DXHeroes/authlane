id: github
name: GitHub
auth_type: oauth2
branding:
  description: Repositories, issues, pull requests, and code search.
  brand_color: '#181717'
  initials: GH
  category: engineering
config:
  authorization_url: https://github.com/login/oauth/authorize
  token_url: https://github.com/login/oauth/access_token
  scopes:
    - repo
    - user
    - read:org
  default_scopes:
    - repo
    - user
  read_only_scopes:
    - read:user
    - read:org
  docs_url: https://docs.github.com/en/rest
  setup_guide_url: https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/creating-an-oauth-app
  developer_console_url: https://github.com/settings/developers
  execution:
    preferred: provider_mcp
    provider_mcp:
      endpoint: https://api.githubcopilot.com/mcp/
      docs_url: https://docs.github.com/en/copilot/how-tos/provide-context/use-mcp/set-up-the-github-mcp-server
      maturity: stable












