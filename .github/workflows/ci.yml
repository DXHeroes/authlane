name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# A superseded run tells you about a commit nobody is waiting on any more. Twenty of August's
# forty-one runs on main were replaced within half an hour and billed in full regardless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.23.0'

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_USER: authlane
          POSTGRES_PASSWORD: authlane-ci-only
          POSTGRES_DB: authlane_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['6379:6379']
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://authlane:authlane-ci-only@localhost:5432/authlane_test
      SYSTEM_DATABASE_URL: postgresql://authlane:authlane-ci-only@localhost:5432/authlane_test
      REDIS_URL: redis://localhost:6379
      AUTHLANE_DATA_KEK_RING: ci-data:1111111111111111111111111111111111111111111111111111111111111111
      AUTHLANE_LOOKUP_KEY_RING: ci-lookup:2222222222222222222222222222222222222222222222222222222222222222
      AUTHLANE_REDIS_KEY_RING: ci-redis:3333333333333333333333333333333333333333333333333333333333333333
      BETTER_AUTH_SECRETS: 1:ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:5173
      METRICS_BEARER_TOKEN: ci-metrics-token-at-least-32-characters
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:runtime
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build

  # The only test that the turnkey demo from QUICKSTART.md actually boots, and the only
  # browser-level assertion that provider tokens never reach the client. Worth keeping, not
  # worth running on a merge whose pull request already ran it.
  demo:
    name: Turnkey demo E2E
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm demo:test

