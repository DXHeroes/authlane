[build]
builder = "NIXPACKS"
buildCommand = "pnpm install && pnpm --filter @authlane/api build"

[deploy]
startCommand = "pnpm --filter @authlane/api start"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[deploy.environmentVariables]]
name = "NODE_ENV"
value = "production"

[[deploy.environmentVariables]]
name = "PORT"
value = "8080"
