global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'authlane'

scrape_configs:
  - job_name: 'authlane-api'
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_bearer_token
    static_configs:
      - targets: ['app:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
