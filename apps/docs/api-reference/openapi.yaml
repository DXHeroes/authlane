openapi: 3.1.0
info:
  title: Authlane Control Plane API
  version: 1.0.0
  description: Manages SaaS tenant policy, end-user connections, credentials, and tool definitions. Provider tool traffic does not pass through this API.
servers:
  - url: https://authlane.example.com
  - url: http://localhost:3000
security:
  - apiKey: []
paths:
  /api/v1/catalog/services:
    get:
      operationId: listCatalogServices
      summary: List enabled tenant services
      x-authlane-scope: catalog:read
      responses:
        '200':
          $ref: '#/components/responses/Services'
  /api/v1/users/{externalUserId}/connections:
    get:
      operationId: listConnections
      summary: List effective connection statuses
      x-authlane-scope: connections:read
      parameters:
        - $ref: '#/components/parameters/ExternalUserId'
      responses:
        '200':
          description: Connected and disconnected service statuses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionsResult'
  /api/v1/users/{externalUserId}/capabilities:
    get:
      operationId: getCapabilities
      summary: Get statuses and tool definitions in one hot-read snapshot
      x-authlane-scope: connections:read
      parameters:
        - $ref: '#/components/parameters/ExternalUserId'
        - $ref: '#/components/parameters/ToolFormat'
      responses:
        '200':
          description: Capability snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResult'
  /api/v1/users/{externalUserId}/tools:
    get:
      operationId: listTools
      summary: List definitions for currently usable connections
      x-authlane-scope: connections:read
      parameters:
        - $ref: '#/components/parameters/ExternalUserId'
        - $ref: '#/components/parameters/ToolFormat'
      responses:
        '200':
          description: MCP tools or OpenAI functions with version hash
  /api/v1/users/{externalUserId}/connections/{serviceId}/credential-leases:
    post:
      operationId: createCredentialLease
      summary: Issue access-only credential material
      description: Server-only, audited, non-cacheable response. OAuth refresh and ID tokens are never returned.
      x-authlane-scope: credentials:issue
      parameters:
        - $ref: '#/components/parameters/ExternalUserId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '201':
          description: Credential lease
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store, private
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialLeaseResult'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/connect-sessions:
    post:
      operationId: createConnectSession
      summary: Create a short-lived browser handoff
      x-authlane-scope: connect-sessions:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalUserId, allowedServices, allowedOrigin]
              properties:
                externalUserId:
                  type: string
                allowedServices:
                  type: array
                  minItems: 1
                  items:
                    type: string
                allowedOrigin:
                  type: string
                  format: uri
                expiresInSeconds:
                  type: integer
                  minimum: 60
                  maximum: 900
                  default: 600
                reauthenticatedAt:
                  type: string
                  format: date-time
                  description: Required to authorize disconnect. The tenant must have reauthenticated the end-user within five minutes.
      responses:
        '201':
          description: Raw token is returned once for browser handoff
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store, private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectSessionResult'
  /api/v1/connect/{serviceId}/authorize:
    post:
      security:
        - connectSession: []
      operationId: authorizeConnection
      summary: Start OAuth from a connect session
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectAction'
      responses:
        '200':
          description: Provider authorization URL
    delete:
      security:
        - connectSession: []
      operationId: disconnectService
      summary: Disconnect through a connect session
      description: Requires a connect session created immediately after tenant-controlled end-user reauthentication.
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectAction'
      responses:
        '200':
          description: Disconnect result
  /api/v1/oauth/{serviceId}/callback:
    get:
      security: []
      operationId: oauthCallback
      summary: Validate state and exchange the provider code
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the hosted connect callback
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: Authlane scoped API key
    connectSession:
      type: apiKey
      in: header
      name: Authorization
      description: Use `ConnectSession <opaque-token>`.
  parameters:
    ExternalUserId:
      name: externalUserId
      in: path
      required: true
      schema:
        type: string
        maxLength: 255
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
    ToolFormat:
      name: format
      in: query
      schema:
        type: string
        enum: [mcp, openai]
        default: mcp
  schemas:
    Error:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string
        hint:
          type: string
        docUrl:
          type: string
          format: uri
    Connection:
      type: object
      required: [serviceId, status, connected, expiresAt]
      properties:
        serviceId:
          type: string
        status:
          type: string
          enum: [disconnected, pending, connected, expired, error]
        connected:
          type: boolean
        expiresAt:
          type: [string, 'null']
          format: date-time
        connectedAt:
          type: [string, 'null']
          format: date-time
        lastCheckedAt:
          type: [string, 'null']
          format: date-time
        errorCode:
          type: [string, 'null']
    ConnectionsResult:
      type: object
      required: [data, error]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Connection'
        error:
          type: 'null'
    CapabilitiesResult:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [externalUserId, format, version, services]
          properties:
            externalUserId:
              type: string
            format:
              type: string
              enum: [mcp, openai]
            version:
              type: string
            services:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/Connection'
                  - type: object
                    required: [tools]
                    properties:
                      tools:
                        type: array
                        items:
                          type: object
        error:
          type: 'null'
    CredentialLeaseResult:
      type: object
      required: [data, error]
      properties:
        data:
          oneOf:
            - type: object
              required: [type, leaseId, accessToken, tokenType, scopes, expiresAt]
              properties:
                type:
                  const: oauth2
                leaseId:
                  type: string
                  format: uuid
                accessToken:
                  type: string
                tokenType:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                expiresAt:
                  type: [string, 'null']
                  format: date-time
            - type: object
              required: [type, leaseId, value, placement, expiresAt]
              properties:
                type:
                  const: api_key
                leaseId:
                  type: string
                  format: uuid
                value:
                  type: string
                placement:
                  oneOf:
                    - type: object
                      required: [type, name]
                      properties:
                        type:
                          const: header
                        name:
                          type: string
                        prefix:
                          type: string
                    - type: object
                      required: [type, name]
                      properties:
                        type:
                          const: query
                        name:
                          type: string
                expiresAt:
                  type: [string, 'null']
                  format: date-time
        error:
          type: 'null'
    ConnectAction:
      type: object
      required: [parentOrigin]
      properties:
        parentOrigin:
          type: string
          format: uri
    ConnectSessionResult:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [id, token, url, expiresAt]
          properties:
            id:
              type: string
            token:
              type: string
            url:
              type: string
              format: uri
            expiresAt:
              type: string
              format: date-time
        error:
          type: 'null'
  responses:
    Services:
      description: Tenant service catalog
    Error:
      description: Authlane error
      content:
        application/json:
          schema:
            type: object
            required: [data, error]
            properties:
              data:
                type: 'null'
              error:
                $ref: '#/components/schemas/Error'
