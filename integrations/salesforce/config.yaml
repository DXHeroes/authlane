id: salesforce
name: Salesforce
auth_type: oauth2
branding:
  description: Accounts, opportunities, and custom objects in your org.
  brand_color: '#00a1e0'
  initials: SF
  category: crm
config:
  authorization_url: https://login.salesforce.com/services/oauth2/authorize
  token_url: https://login.salesforce.com/services/oauth2/token
  # Salesforce supports various scopes for API access
  scopes:
    - mcp_api
    - api
    - refresh_token
    - offline_access
    - id
    - openid
    - chatter_api
    - full
    - web
  default_scopes:
    - mcp_api
    - api
    - refresh_token
    - id
  read_only_scopes:
    - mcp_api
    - api
    - refresh_token
    - id
  # Salesforce-specific settings
  features:
    soql: true  # Supports Salesforce Object Query Language
    bulk_api: true
    rest_api: true
    metadata_api: true
  # Salesforce uses instance URLs (e.g., https://na1.salesforce.com)
  # The instance URL is returned during OAuth and stored per connection
  api_version: v60.0
  docs_url: https://developer.salesforce.com/docs/platform/hosted-mcp-servers/overview
  setup_guide_url: https://developer.salesforce.com/docs/platform/hosted-mcp-servers/guide/create-external-client-app.html
  developer_console_url: https://login.salesforce.com
  execution:
    preferred: provider_mcp
    provider_mcp:
      endpoint: https://api.salesforce.com/platform/mcp/v1/platform/sobject-all
      docs_url: https://developer.salesforce.com/docs/platform/hosted-mcp-servers/guide/client-connection-overview.html
      maturity: stable
    fallback: direct_api
