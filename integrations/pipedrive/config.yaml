id: pipedrive
name: Pipedrive
auth_type: oauth2
config:
  authorization_url: https://oauth.pipedrive.com/oauth/authorize
  token_url: https://oauth.pipedrive.com/oauth/token
  scopes:
    - deals:read
    - deals:full
    - contacts:read
    - contacts:full
    - search:read
  default_scopes:
    - deals:full
    - contacts:full
    - search:read
  read_only_scopes:
    - deals:read
    - contacts:read
    - search:read
  # Pipedrive uses company-specific API domains
  # The API domain is returned during OAuth as api_domain (e.g., mycompany.pipedrive.com)
  # API requests go to https://{api_domain}/v1/
  features:
    rest_api: true
    webhooks: true
    custom_fields: true
  api_version: v1
  docs_url: https://developers.pipedrive.com/docs/api/v1
  setup_guide_url: https://pipedrive.readme.io/docs/marketplace-oauth-authorization
  developer_console_url: https://pipedrive.readme.io/docs/marketplace-manager
  execution:
    preferred: provider_mcp
    provider_mcp:
      endpoint: https://mcp.pipedrive.ai/mcp
      docs_url: https://support.pipedrive.com/en/article/mcp-chatgpt
      maturity: beta
    fallback: direct_api
