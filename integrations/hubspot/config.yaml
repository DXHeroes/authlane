id: hubspot
name: HubSpot
auth_type: oauth2
branding:
  description: Contacts, companies, deals, and engagements in your CRM.
  brand_color: '#ff7a59'
  initials: HS
  category: crm
config:
  authorization_url: https://mcp.hubspot.com/oauth/authorize/user
  token_url: https://mcp.hubspot.com/oauth/v3/token
  scopes: []
  default_scopes: []
  read_only_scopes: []
  docs_url: https://developers.hubspot.com/docs/api-reference/overview
  setup_guide_url: https://developers.hubspot.com/docs/apps/developer-platform/build-apps/integrate-with-the-remote-hubspot-mcp-server
  developer_console_url: https://app.hubspot.com/developer/
  execution:
    preferred: provider_mcp
    provider_mcp:
      endpoint: https://mcp.hubspot.com
      docs_url: https://developers.hubspot.com/docs/apps/developer-platform/build-apps/integrate-with-the-remote-hubspot-mcp-server
      maturity: stable
