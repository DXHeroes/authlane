id: discord
name: Discord
auth_type: oauth2
branding:
  description: Servers, channels, and messages your account can reach.
  brand_color: '#5865f2'
  initials: DC
  category: communication
config:
  authorization_url: https://discord.com/api/oauth2/authorize
  token_url: https://discord.com/api/oauth2/token
  scopes:
    - identify
    - guilds
    - guilds.members.read
    - connections
  default_scopes:
    - identify
    - guilds
    - guilds.members.read
    - connections
  read_only_scopes:
    - identify
    - guilds
    - guilds.members.read
    - connections
  docs_url: https://docs.discord.com/developers/reference
  setup_guide_url: https://docs.discord.com/developers/quick-start/getting-started
  developer_console_url: https://discord.com/developers/applications
  execution:
    preferred: direct_api
