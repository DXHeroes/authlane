id: microsoft-mail
name: Microsoft Mail
auth_type: oauth2
config:
  authorization_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
  token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
  scopes:
    - api://workiq.svc.cloud.microsoft/WorkIQAgent.Ask
    - offline_access
    - openid
    - profile
  default_scopes:
    - api://workiq.svc.cloud.microsoft/WorkIQAgent.Ask
    - offline_access
    - openid
    - profile
  read_only_scopes:
    - api://workiq.svc.cloud.microsoft/WorkIQAgent.Ask
    - offline_access
    - openid
    - profile
  docs_url: https://learn.microsoft.com/microsoft-365/copilot/extensibility/work-iq/mcp/overview
  setup_guide_url: https://learn.microsoft.com/microsoft-365/copilot/extensibility/work-iq/mcp/quickstart/foundry
  developer_console_url: https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade
  execution:
    preferred: provider_mcp
    provider_mcp:
      endpoint: https://workiq.svc.cloud.microsoft/mcp
      docs_url: https://learn.microsoft.com/microsoft-365/copilot/extensibility/work-iq/mcp/overview
      maturity: beta
