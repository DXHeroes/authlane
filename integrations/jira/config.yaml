id: jira
name: Jira
auth_type: oauth2
config:
  authorization_url: https://auth.atlassian.com/authorize
  token_url: https://auth.atlassian.com/oauth/token
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - offline_access
  default_scopes:
    - read:jira-work
    - write:jira-work
